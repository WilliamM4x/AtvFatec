services:
  postgres:
    image: postgres:16-alpine
    container_name: orm-users-cars-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=orm_users_cars
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d orm_users_cars" ]
      interval: 5s
      timeout: 5s
      retries: 10
      
volumes:
  postgres_data: