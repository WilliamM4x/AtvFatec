services:
  postgres:
    build:
      context: ./postgres
    container_name: postgres-nestjs
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bdaula
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bdaula"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
