services:
  database:
    image: postgres:15
    container_name: megasena-db
    env_file: .env 
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./db-data:/var/lib/postgresql/data
      - ./database/megasena.csv:/database/megasena.csv
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql

  server:
    build: ./server
    container_name: megasena-server
    env_file: .env
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      - database
  
  front:
    build: ./front
    container_name: megasena-front
    env_file: .env 
    ports:
      - "3000:5173"
    volumes:
      - ./front:/app/front
      - /app/front/node_modules
    environment:
      - VITE_API_URL=http://localhost:3001 
    depends_on:
      - server